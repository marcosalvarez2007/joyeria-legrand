<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar SesiOn - Legrand Joyas</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background: linear-gradient(135deg, #1a120b, #3a2a1f); min-height:100vh; display:grid; place-items:center;">
    <main style="width:min(480px,90vw); background:#fff; border-radius:28px; padding:3rem; box-shadow:0 30px 80px rgba(0,0,0,0.3);">
        <div style="text-align:center; margin-bottom:2rem;">
            <a href="index.html" class="logo" style="display:inline-block; color:inherit;">LEGRAND</a>
            <p style="color:var(--muted); margin-top:1rem;">Acceda a tu cuenta y continúa tu experiencia premium.</p>
        </div>
        <div class="form-grid">
            <input id="email" type="email" placeholder="Correo electronico" autocomplete="email">
            <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
            <button class="btn btn-primary" onclick="iniciarSesion()">Iniciar sesion</button>
        </div>

        <div style="display:flex; align-items:center; gap:1rem; margin: 1.5rem 0;">
            <div style="flex:1; height:1px; background:var(--border);"></div>
            <span style="color:var(--muted); font-size:0.85rem;">o</span>
            <div style="flex:1; height:1px; background:var(--border);"></div>
        </div>

        <button type="button" onclick="iniciarSesionConGoogle()" style="width:100%; display:flex; align-items:center; justify-content:center; gap:0.75rem; padding:0.85rem 1rem; border-radius:999px; border:1px solid var(--border); background:#fff; cursor:pointer; font-family:inherit; font-size:0.95rem; color:#1a120b;">
            <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.3 34.9 26.8 36 24 36c-5.4 0-9.9-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.5-2.5 4.6-4.6 6.1l6.3 5.3C40.4 36.5 44 30.9 44 24c0-1.2-.1-2.4-.4-3.5z"/>
            </svg>
            Continuar con Google
        </button>

        <p style="text-align:center; color:var(--muted); margin-top:1.5rem;">No tienes cuenta? <a href="registro.html" style="color:var(--gold);">Registrate</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script>
        async function iniciarSesion() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                return alert('Completa email y contraseña.');
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                return alert('Error al iniciar sesión: ' + error.message);
            }
            if (data.user) {
                setUserData(data.user);

                // Verificar si el usuario es admin/empleado para redirigirlo al panel
                const { data: perfil } = await supabase
                    .from('usuarios')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                if (perfil?.role === 'admin') {
                    window.location.href = 'admin/dashboard.html';
                    return;
                }

                alert('Bienvenido a Legrand Joyas');
                window.location.href = 'index.html';
            }
        }

        document.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') iniciarSesion();
        });

        async function iniciarSesionConGoogle() {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });
            if (error) {
                alert('Error al iniciar sesión con Google: ' + error.message);
            }
            // Si no hay error, el navegador redirige a Google automáticamente.
        }
    </script>
</body>
</html>
